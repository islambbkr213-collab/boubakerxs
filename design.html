<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boubaker — Design & 3D</title>
<meta name="description" content="Selected brand, logo and 3D design work by Boubaker.">
<meta name="theme-color" content="#000000"><meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/design-dark.css?v=4">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
</head>
<body>
<div class="bar"><a href="design.html">Boubaker</a><a class="back" href="index.html" aria-label="Back to video portfolio">←</a></div>
<main class="show" id="show"><div class="skel"></div><div class="skel"></div><div class="skel"></div></main>
<div class="modal" id="modal" aria-hidden="true"><button class="x" id="x" aria-label="Close">×</button><div class="mp" id="mc"></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let all=[];
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
function render(){$('#show').innerHTML=all.length?all.map((p,i)=>`<button class="tile" data-i="${i}" aria-label="${esc(p.title)}">${p.cover_url?`<img src="${esc(p.cover_url)}" alt="${esc(p.title)}" loading="${i<2?'eager':'lazy'}">`:`<div class="ph">${esc(p.category||'')}</div>`}<div class="cap"><small>${esc(p.category)}</small><b>${esc(p.title)}</b></div></button>`).join(''):'<div class="none">New work coming soon.</div>';
document.querySelectorAll('.tile').forEach(t=>io.observe(t))}
$('#show').onclick=e=>{const t=e.target.closest('.tile');if(t)open(all[+t.dataset.i])};
function open(p){const g=Array.isArray(p.media_urls)?p.media_urls:[];const imgs=[p.cover_url,...g].filter(Boolean);
const bh=p.behance_url?`<a class="bh" href="${esc(p.behance_url)}" target="_blank" rel="noopener" aria-label="View on Behance"><b>Bē</b><span>View on Behance</span><i>↗</i></a>`:'';
$('#mc').innerHTML=`<div class="top"><div><small>${esc(p.category)}</small><h2>${esc(p.title)}</h2>${p.description?`<p>${esc(p.description)}</p>`:''}</div>${bh}</div>${imgs.map(u=>`<img src="${esc(u)}" loading="lazy" alt="${esc(p.title)}">`).join('')}${bh?`<div class="end">${bh}</div>`:''}`;
$('#modal').classList.add('open');$('#modal').scrollTop=0;document.body.classList.add('lock')}
const close=()=>{$('#modal').classList.remove('open');document.body.classList.remove('lock')};
$('#x').onclick=close;document.addEventListener('keydown',e=>e.key==='Escape'&&close());
(async()=>{try{const C=window.SITE_CONFIG;if(!C?.SUPABASE_URL)throw 0;const sb=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);const{data,error}=await sb.from('design_projects').select('*').eq('published',true).order('sort_order').order('created_at',{ascending:false});if(error)throw error;all=data||[]}catch(e){all=[]}render()})();
</script>
<script src="assets/cursor-trail.js" defer></script>
</body></html>
