<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Generate Project HTML</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; padding: 40px; color: #0f172a; }
        .admin-container { max-width: 700px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); transition: box-shadow .4s cubic-bezier(.2,.8,.2,1); }
        .admin-container:hover { box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
        h1 { margin-bottom: 20px; font-size: 1.8rem; }
        p { color: #64748b; margin-bottom: 20px; font-size: 0.9rem; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.9rem; transition: color .3s ease; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-family: inherit; transition: all .3s cubic-bezier(.2,.8,.2,1); }
        input:focus, textarea:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); transform: translateY(-1px); }
        button { background: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; margin-top: 10px; transition: all .4s cubic-bezier(.2,.8,.2,1); }
        button:hover { background: #1d4ed8; transform: translateY(-2px); box-shadow: 0 8px 20px -6px rgba(37,99,235,0.5); }
        button:active { transform: translateY(0); }
        .output-box { margin-top: 30px; }
        textarea.code-output { height: 250px; font-family: monospace; background: #f8fafc; color: #0f172a; transition: all .3s ease; }
        textarea.code-output:focus { background: #f1f5f9; }
        .note { background: #fef3c7; color: #92400e; padding: 15px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 20px; animation: slideIn .5s cubic-bezier(.2,.8,.2,1); }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="admin-container">
        <h1>Project HTML Generator</h1>
        
        <div class="note">
            <strong>Note:</strong> Since your site is hosted on GitHub Pages (static), you cannot auto-post directly from here. Fill out the form below, click "Generate Code", copy the HTML code, and paste it into your <code>index.html</code> file inside the <code>&lt;div class="portfolio-grid"&gt;</code> section.
        </div>

        <div class="form-group">
            <label>Project Title</label>
            <input type="text" id="p-title" placeholder="e.g., 3D Character Design">
        </div>
        
        <div class="form-group">
            <label>Image URL (or path)</label>
            <input type="text" id="p-image" placeholder="e.g., assets/my-image.jpg or https://...">
        </div>

        <div class="form-group">
            <label>Short Description</label>
            <textarea id="p-desc" rows="3" placeholder="e.g., Advanced 3D modeling and texturing."></textarea>
        </div>

        <div class="form-group">
            <label>Behance Project Link</label>
            <input type="text" id="p-link" placeholder="e.g., https://www.behance.net/gallery/12345/Project">
        </div>

        <button onclick="generateCode()">Generate HTML Code</button>

        <div class="output-box">
            <label>Copy this code into index.html:</label>
            <textarea class="code-output" id="output" readonly></textarea>
        </div>
    </div>

    <script>
        function generateCode() {
            const title = document.getElementById('p-title').value || 'Project Title';
            const image = document.getElementById('p-image').value || 'https://via.placeholder.com/400x250';
            const desc = document.getElementById('p-desc').value || 'Project Description';
            const link = document.getElementById('p-link').value || '#';

            const htmlCode = `
<!-- Project Card -->
<div class="portfolio-card">
    <img src="${image}" alt="${title}">
    <div class="portfolio-content">
        <h3>${title}</h3>
        <p>${desc}</p>
        <a href="${link}" target="_blank" class="portfolio-link">View on Behance &rarr;</a>
    </div>
</div>
`;
            document.getElementById('output').value = htmlCode.trim();
        }
    </script>
</body>
</html>
