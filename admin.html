<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin</title>
<style>
:root{--bg:#06263c;--ink:#eef6fb;--mute:rgba(238,246,251,.68);--line:rgba(255,255,255,.16);--blue:#7cc4f4}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:24px;line-height:1.5}
.box{max-width:640px;margin:0 auto 20px;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:28px;padding:28px}
h1{font-size:28px;letter-spacing:-.03em;margin-bottom:6px}h2{font-size:20px;margin-bottom:6px}
label{display:block;font-size:14px;color:var(--mute);margin:14px 0 6px}
input,select,textarea{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);font:inherit}
select option{color:#000}
button{margin-top:18px;padding:12px 22px;border:0;border-radius:99px;background:var(--blue);color:#05263c;font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--blue);border:1px solid var(--blue);margin:0}
.row{display:flex;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.row img{width:84px;height:52px;object-fit:cover;border-radius:10px}
.row div{flex:1;min-width:0}.row b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row button{padding:8px 14px;font-size:14px}
.sh{font-size:15px;color:var(--blue);margin:24px 0 2px;font-weight:600}
.m{margin-top:14px;font-size:14px;color:var(--blue)}.hide{display:none}.top{display:flex;justify-content:space-between;align-items:center}
</style></head><body>
<div class="box" id="login"><h1>Admin login</h1><p style="color:var(--mute)">Only you can sign in here.</p>
<label>Email</label><input id="em" type="email" autocomplete="username"><label>Password</label><input id="pw" type="password" autocomplete="current-password">
<button id="go" type="button">Sign in</button><p class="m" id="lmsg"></p></div>

<div id="app" class="hide">
<div class="box"><div class="top"><h1>Your projects</h1><button class="ghost" id="out" type="button">Sign out</button></div>
<h2 style="margin-top:18px">Add or edit a project</h2>
<form id="form"><label>Title</label><input id="t">
<label>Type</label><select id="c"><option>Video editing</option><option>SaaS motion</option><option>Design</option></select>
<label>Short description</label><textarea id="d" rows="2"></textarea>
<label>YouTube link (leave empty for design work)</label><input id="y" placeholder="https://youtu.be/...">
<label>Thumbnail image</label><input id="f" type="file" accept="image/*">
<button id="save" type="button">Add project</button></form><p class="m" id="msg"></p></div>
<div class="box"><h2>Published on your site</h2><div id="list"></div></div>
<div class="box"><h2>Site text and settings</h2><p class="m" style="color:var(--mute)">Change any text below, then click Save. Your site updates within a few seconds. Leave a social link empty to hide it.</p>
<div id="sfields"></div><button id="ssave" type="button">Save site settings</button><p class="m" id="smsg"></p></div></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const C=window.SITE_CONFIG,$=id=>document.getElementById(id),msg=t=>$('msg').textContent=t;
if(!C||/PASTE/.test(C.SUPABASE_URL)){$('login').innerHTML='<h1>Setup needed</h1><p>Open config.js and paste your Supabase URL and key.</p>'}
else{
const sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);let editId=null;
const ytId=u=>{const m=String(u||'').match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/);return m?m[1]:/^[\w-]{11}$/.test(u||'')?u:''};
const show=async()=>{const{data:{session}}=await sb.auth.getSession();$('login').classList.toggle('hide',!!session);$('app').classList.toggle('hide',!session);if(session){load();loadS()}};
$('go').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});$('lmsg').textContent=error?error.message:'';show()};
$('out').onclick=async()=>{await sb.auth.signOut();show()};
const load=async()=>{const{data}=await sb.from('projects').select('*').order('created_at',{ascending:false});const rows=data||[];
 $('list').innerHTML=rows.length?'':'<p style="color:var(--mute)">Nothing yet.</p>';
 rows.forEach(p=>{const d=document.createElement('div');d.className='row';d.innerHTML='<img alt=""><div><b></b><small style="color:var(--mute)"></small></div><button class="ghost">Edit</button><button class="ghost">Delete</button>';
  d.querySelector('img').src=p.thumb_url||'';d.querySelector('b').textContent=p.title;d.querySelector('small').textContent=p.category||'';
  const[ed,del]=d.querySelectorAll('button');
  ed.onclick=()=>{editId=p.id;$('t').value=p.title;$('c').value=p.category||'Video editing';$('d').value=p.description||'';$('y').value=p.youtube_id?'https://youtu.be/'+p.youtube_id:'';$('save').textContent='Save changes';scrollTo(0,0)};
  del.onclick=async()=>{if(!confirm('Delete "'+p.title+'"?'))return;
   if((p.thumb_url||'').includes('/thumbs/'))await sb.storage.from('thumbs').remove([p.thumb_url.split('/thumbs/')[1]]);
   await sb.from('projects').delete().eq('id',p.id);load()};
  $('list').append(d)})};
const shrink=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1600/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(r,'image/jpeg',.86)};i.src=URL.createObjectURL(f)});
$('save').onclick=async()=>{
 const title=$('t').value.trim();if(!title)return msg('Please write a title.');
 if($('c').value==='Design'&&!$('f').files[0]&&!editId)return msg('Please choose an image for your design.');
 const y=$('y').value.trim(),yid=ytId(y);if(y&&!yid)return msg('That YouTube link does not look right.');
 msg('Saving...');const rec={title,category:$('c').value,description:$('d').value.trim(),youtube_id:yid||null};
 const f=$('f').files[0];
 if(f){const path=Date.now()+'.jpg',up=await sb.storage.from('thumbs').upload(path,await shrink(f),{contentType:'image/jpeg'});if(up.error)return msg(up.error.message);rec.thumb_url=sb.storage.from('thumbs').getPublicUrl(path).data.publicUrl}
 const{error}=await(editId?sb.from('projects').update(rec).eq('id',editId):sb.from('projects').insert(rec));
 if(error)return msg(error.message);
 editId=null;$('form').reset();$('save').textContent='Add project';msg('Saved! It is now live on your website.');load()};
// ---- site text & settings ----
const SF=[
 ['h','Hero'],['status','Badge text','t'],['h1','Headline (use | to separate)','t'],['h1Prefix','Headline line 2, start (white)','t'],['h1Accent','Headline line 2, accent (blue italic)','t'],
 ['lead','Hero description','a'],['btn1','Button 1 text','t'],['btn2','Button 2 text','t'],
 ['h','Stats'],['s1n','Stat 1 number','t'],['s1l','Stat 1 label','t'],['s2n','Stat 2 number','t'],['s2l','Stat 2 label','t'],['s3n','Stat 3 number','t'],['s3l','Stat 3 label','t'],
 ['h','About'],['aTitle','Title','t'],['aP1','Paragraph 1','a'],['aP2','Paragraph 2','a'],
 ['h','Contact'],['cTitle','Title (the last word becomes italic)','t'],['cSub','Text','a'],['cBtn','Email button text','t'],['email','Email address','t'],
 ['h','Social links (empty = hidden, full https link)'],['ig','Instagram','t'],['be','Behance','t'],['li','LinkedIn','t'],['wa','WhatsApp','t'],
 ['h','Footer'],['footer','Footer text','t'],
 ['h','Animation'],['speed','Animation length (1 = normal, below 1 faster, above 1 slower)','r']
];
const SDEF={status:'Open for projects',h1:'Video Editing | Motion | Design',h1Prefix:'for',h1Accent:'Brands & Creators',
 lead:'I edit videos and animate SaaS products so people understand them in seconds.',btn1:'See my work',btn2:'Start a project',
 s1n:'120+',s1l:'Videos delivered',s2n:'35',s2l:'SaaS products animated',s3n:'48h',s3l:'Typical first draft',
 aTitle:"Hi, I'm Boubaker.",aP1:"I'm a video editor and motion designer based in Algeria, working with SaaS teams and creators worldwide. I turn complex products into clear, watchable stories.",aP2:'Available for freelance and long-term collaborations.',
 cTitle:"Let's make something move.",cSub:"Tell me about your project and I'll reply within a day.",cBtn:'Email me',email:'you@example.com',
 ig:'',be:'',li:'',wa:'',footer:'© 2026 Boubaker. All rights reserved.',speed:1};
$('sfields').innerHTML=SF.map(([k,l,t])=>{
  if(t===undefined)return '<h3 class="sh">'+l+'</h3>';
  if(t==='a')return '<label>'+l+'</label><textarea id="f_'+k+'" rows="3"></textarea>';
  if(t==='r')return '<label>'+l+' <span id="o_speed" style="color:var(--blue)"></span></label><input id="f_'+k+'" type="range" min="0.5" max="2" step="0.1" oninput="document.getElementById(\'o_speed\').textContent=this.value">';
  return '<label>'+l+'</label><input id="f_'+k+'">';
}).join('');
const loadS=async()=>{
  const{data,error}=await sb.from('site_settings').select('value').eq('key','main').maybeSingle();
  if(error){$('smsg').textContent=error.message;return}
  const v=Object.assign({},SDEF,(data&&data.value)||{});
  SF.filter(x=>x[2]).forEach(([k])=>{const el=$('f_'+k);if(el)el.value=v[k]!=null?v[k]:''});
  $('o_speed').textContent=$('f_speed').value;
};
$('ssave').onclick=async()=>{
  const o={};SF.filter(x=>x[2]).forEach(([k,l,t])=>{const el=$('f_'+k);o[k]=t==='r'?parseFloat(el.value):el.value.trim()});
  $('smsg').textContent='Saving...';
  const{error}=await sb.from('site_settings').upsert({key:'main',value:o});
  $('smsg').textContent=error?error.message:'Saved! Your site updates within a few seconds. Refresh the site to see it.';
};
show();}
</script></body></html>
